<div class="unauthorized-wrapper d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
  <div class="card border-0 shadow-lg text-center p-4 p-md-5 rounded-4 max-w-lg">
    
    <!-- Illustration / Graphic Icon -->
    <div class="icon-circle bg-danger-subtle text-danger mx-auto mb-4 d-flex align-items-center justify-content-center rounded-circle">
      <i class="bi bi-shield-lock-fill display-4"></i>
    </div>

    <!-- Error Code & Header -->
    <span class="badge bg-danger-subtle text-danger fw-semibold px-3 py-2 rounded-pill fs-7 mb-2">Error 403</span>
    <h2 class="fw-bold text-dark mb-2">Access Denied</h2>
    
    <!-- Explanation Message -->
    <p class="text-muted fs-6 mb-4">
      You don't have permission to access this page or resource. Please check your user permissions or try switching to an authorized account.
    </p>

    <!-- Action Buttons -->
    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
      <button class="btn btn-outline-secondary px-4 py-2 fw-medium d-flex align-items-center justify-content-center gap-2" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
        <span>Go Back</span>
      </button>

      <button class="btn btn-primary px-4 py-2 fw-medium d-flex align-items-center justify-content-center gap-2" (click)="goHome()">
        <i class="bi bi-house-door-fill"></i>
        <span>Back to Home</span>
      </button>
    </div>

    <!-- Secondary Help Link -->
    <div class="mt-4 pt-3 border-top">
      <p class="text-muted fs-7 mb-0">
        Believe this is a mistake? 
        <a href="javascript:void(0)" (click)="contactSupport()" class="text-primary text-decoration-none fw-semibold">Contact Administrator</a>
      </p>
    </div>

  </div>
</div>
