<div>
  <!-- Header -->
  <div
    class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4"
  >
    <h3 class="text-base font-semibold text-slate-800">
      {{ editData ? "Edit Book" : "Add New Book" }}
    </h3>
    <button
      type="button"
      (click)="closeForm()"
      class="text-xs text-slate-500 hover:text-slate-700 font-medium transition"
    >
      &times; Close Form
    </button>
  </div>

  <!-- Alert Banner -->
  <div
    *ngIf="errorMessage"
    class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded"
  >
    {{ errorMessage }}
  </div>

  <!-- Form Fields -->
  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Title -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">
          Book Title <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="title"
          placeholder="Enter book title"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        <span
          *ngIf="
            bookForm.get('title')?.invalid && bookForm.get('title')?.touched
          "
          class="text-[11px] text-red-500 mt-1 block"
        >
          Title is required (max 150 characters)
        </span>
      </div>

      <!-- Book Number -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">
          Book Number <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="bookNumber"
          placeholder="e.g. B-101"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        <span
          *ngIf="
            bookForm.get('bookNumber')?.invalid &&
            bookForm.get('bookNumber')?.touched
          "
          class="text-[11px] text-red-500 mt-1 block"
        >
          Book number is required
        </span>
      </div>

      <!-- ISBN Number -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >ISBN Number</label
        >
        <input
          type="text"
          formControlName="isbnNumber"
          placeholder="e.g. 978-3-16-148410-0"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        <span
          *ngIf="
            bookForm.get('isbnNumber')?.invalid &&
            bookForm.get('isbnNumber')?.touched
          "
          class="text-[11px] text-red-500 mt-1 block"
        >
          Invalid ISBN format
        </span>
      </div>

      <!-- Publisher -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >Publisher</label
        >
        <input
          type="text"
          formControlName="publisher"
          placeholder="Publisher name"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Author -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >Author</label
        >
        <input
          type="text"
          formControlName="author"
          placeholder="Author name"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Subject -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >Subject</label
        >
        <input
          type="text"
          formControlName="subject"
          placeholder="Subject name"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Rack Selection -->
      <div>
        <label
          for="rackCode"
          class="block text-xs font-medium text-slate-700 mb-1"
        >
          Rack Number
        </label>
        <select
          id="rackCode"
          formControlName="rackCode"
          class="w-full h-9 px-3 bg-white border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 disabled:bg-slate-100 disabled:cursor-not-allowed"
        >
          <option [value]="''" disabled selected>Select Rack</option>

          <!-- Optional: Placeholder when no racks are available -->
          <option *ngIf="racks.length === 0" [value]="''" disabled>
            No racks available
          </option>

          <!-- Rack List -->
          <option *ngFor="let rack of racks" [value]="rack.rackCode">
            {{ rack.rackCode
            }}{{ rack.location ? " (" + rack.location + ")" : "" }}
          </option>
        </select>
      </div>

      <!-- Price -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >Price ($)</label
        >
        <input
          type="number"
          step="0.01"
          formControlName="price"
          placeholder="0.00"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        <span
          *ngIf="
            bookForm.get('price')?.invalid && bookForm.get('price')?.touched
          "
          class="text-[11px] text-red-500 mt-1 block"
        >
          Price cannot be negative
        </span>
      </div>

      <!-- Quantity -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">
          Total Quantity <span class="text-red-500">*</span>
        </label>
        <input
          type="number"
          formControlName="qty"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Available Quantity -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">
          Available Quantity <span class="text-red-500">*</span>
        </label>
        <input
          type="number"
          formControlName="availableQty"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Post Date -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >Post Date</label
        >
        <input
          type="date"
          formControlName="postDate"
          class="w-full h-9 px-3 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Description -->
      <div class="md:col-span-2 lg:col-span-4">
        <label class="block text-xs font-medium text-slate-700 mb-1"
          >Description</label
        >
        <textarea
          formControlName="description"
          rows="2"
          placeholder="Enter book description"
          class="w-full p-2.5 border border-slate-300 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        ></textarea>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="closeForm()"
        class="px-4 py-2 border border-slate-300 text-slate-700 text-xs font-medium rounded hover:bg-slate-50 transition"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="isSubmitting"
        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded shadow-sm transition disabled:opacity-50 flex items-center gap-1"
      >
        <span>{{
          isSubmitting ? "Saving..." : editData ? "Update Book" : "Save Book"
        }}</span>
      </button>
    </div>
  </form>
</div>
